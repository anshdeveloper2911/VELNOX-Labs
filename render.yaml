services:
  - type: web
    name: velnox-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://velnox-weblabs.web.app,https://velnox-labs.web.app
      - key: DB_FILE
        value: ./data/velnox.db
