<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ==================== PRIMARY SEO ==================== -->

    <title>VELNOX Web Labs | Web Development, Apps & Digital Solutions</title>

    <meta
        name="description"
        content="VELNOX Web Labs builds modern websites, web apps, mobile apps, graphics and digital solutions for businesses, startups and creators."
    >

    <meta
        name="keywords"
        content="VELNOX Web Labs, web development, website development, app development, web design, graphic design, digital solutions, software development, India"
    >

    <meta name="author" content="VELNOX Web Labs">

    <meta name="robots" content="index, follow, max-image-preview:large">

    <meta name="googlebot" content="index, follow">

    <meta name="theme-color" content="#000000">

    <!-- Canonical URL -->
    <link rel="canonical" href="https://velnox-weblabs.web.app/">

    <!-- ==================== FAVICON ==================== -->

    <link rel="icon" type="image/png" href="assets/favicon.png">

    <link rel="apple-touch-icon" href="assets/favicon.png">

    <!-- ==================== OPEN GRAPH ==================== -->

    <meta property="og:type" content="website">

    <meta
        property="og:title"
        content="VELNOX Web Labs | Web Development & Digital Solutions"
    >

    <meta
        property="og:description"
        content="Modern websites, web apps, mobile apps, graphics and digital solutions by VELNOX Web Labs."
    >

    <meta property="og:url" content="https://velnox-weblabs.web.app/">

    <meta property="og:site_name" content="VELNOX Web Labs">

    <meta
        property="og:image"
        content="https://velnox-weblabs.web.app/assets/og-image.jpg"
    >

    <meta property="og:image:alt" content="VELNOX Web Labs">

    <meta property="og:locale" content="en_IN">

    <!-- ==================== TWITTER / X CARD ==================== -->

    <meta name="twitter:card" content="summary_large_image">

    <meta
        name="twitter:title"
        content="VELNOX Web Labs | Web Development & Digital Solutions"
    >

    <meta
        name="twitter:description"
        content="Modern websites, web apps, mobile apps, graphics and digital solutions by VELNOX Web Labs."
    >

    <meta
        name="twitter:image"
        content="https://velnox-weblabs.web.app/assets/og-image.jpg"
    >

    <!-- ==================== PERFORMANCE ==================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- ==================== CSS ==================== -->

    <!-- Sections -->
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/about.css">
    <link rel="stylesheet" href="css/services.css">
    <link rel="stylesheet" href="css/works.css">
    <link rel="stylesheet" href="css/team.css">
    <link rel="stylesheet" href="css/testimonials.css">
    <link rel="stylesheet" href="css/trusted.css">
    <link rel="stylesheet" href="css/contact.css">

    <!-- Components -->
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/auth-ai.css">

</head>

<body>

    <!-- ==================== LOADER ==================== -->



    <!-- ==================== NAVBAR ==================== -->

    <div id="navbar"></div>


    <!-- ==================== MAIN CONTENT ==================== -->

    <main id="app">

        <!-- Home -->
        <div id="home"></div>

        <!-- About -->
        <div id="about"></div>

        <!-- Services -->
        <div id="services"></div>

        <!-- Works -->
        <div id="works"></div>

        <!-- Team -->
        <div id="team"></div>

        <!-- Testimonials -->
        <div id="testimonials"></div>

        <!-- Trusted -->
        <div id="trusted"></div>

        <!-- Contact -->
        <div id="contact"></div>

    </main>


    <!-- ==================== FOOTER ==================== -->

    <div id="footer"></div>

    <button id="velnox-ai-open" type="button" aria-label="Open VELNOX AI">Ask VELNOX AI</button>
    <section id="velnox-ai" hidden aria-label="VELNOX AI assistant">
        <div class="ai-head"><strong>VELNOX AI</strong><button id="velnox-ai-close" type="button" aria-label="Close AI">×</button></div>
        <div id="velnox-ai-messages"><div class="ai-message assistant">Hi! I’m VELNOX AI. Ask me about websites, apps, APIs or your next digital project.</div></div>
        <form id="velnox-ai-form"><input id="velnox-ai-input" maxlength="1200" placeholder="Ask something…" autocomplete="off" required><button type="submit">Send</button></form>
    </section>


    <!-- AUTH MODAL -->
    <section id="velnox-auth-modal" class="auth-modal" hidden aria-label="Account sign in" role="dialog" aria-modal="true">
        <div class="auth-backdrop" data-auth-close></div>
        <div class="auth-card">
            <button class="auth-close" type="button" data-auth-close aria-label="Close sign in">×</button>
            <div class="auth-brand">V<span>·</span></div>
            <p class="auth-kicker">VELNOX WEB LABS</p>
            <h2>Welcome back.</h2>
            <p class="auth-description">Sign in securely with your Google account to continue.</p>
            <button class="google-auth-button" type="button" onclick="window.VELNOX_SIGN_IN?.()">
                <span class="google-mark">G</span>
                <span>Continue with Google</span>
                <span aria-hidden="true">↗</span>
            </button>
            <p class="auth-note">Secure authentication powered by Google Firebase.</p>
        </div>
    </section>


    <!-- ==================== JAVASCRIPT ==================== -->

    <!-- Components -->
    <script src="js/config.js" defer></script>
    <script src="js/loader.js" defer></script>
    <script src="js/navbar.js" defer></script>

    <!-- Sections -->
    <script src="js/home.js" defer></script>
    <script src="js/about.js" defer></script>
    <script src="js/services.js" defer></script>
    <script src="js/works.js" defer></script>
    <script src="js/team.js" defer></script>
    <script src="js/testimonials.js" defer></script>
    <script src="js/trusted.js" defer></script>
    <script src="js/contact.js" defer></script>

    <!-- Footer -->
    <script src="js/footer.js" defer></script>
    <script type="module" src="js/firebase-auth.js"></script>
    <script src="js/ai.js" defer></script>

</body>
</html>
